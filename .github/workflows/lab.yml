name: Strategy Lab (factor backtests)
# Backtests every combination of the app's key factors (jobs/lab/strategy_lab.py) -> lab.json on the `lab-data` branch.
# Runs Saturdays after the 13F job, and on changes to the lab code. progress.json is pushed while it runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jobs/lab/**", "jobs/lib/rally.py", ".github/workflows/lab.yml"]
  schedule:
    - cron: "43 14 * * 6"   # Saturdays 14:43 UTC
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r jobs/requirements.txt
      - name: Latest app data
        run: |
          git fetch --depth 1 origin app-data:refs/remotes/origin/app-data
          git --work-tree=. checkout origin/app-data -- app-data && git reset -q
          git fetch --depth 1 origin lab-data:refs/remotes/origin/lab-data && git show origin/lab-data:lab.json > /tmp/prev_lab.json 2>/dev/null || rm -f /tmp/prev_lab.json
      - name: Run the lab
        run: |
          set -o pipefail
          python -X faulthandler jobs/lab/strategy_lab.py --app-data app-data --download-volume --out /tmp/lab.json --progress /tmp/progress.json 2>&1 | grep -v -i "pandas4warning\|whatsnew\|RuntimeWarning\|_ensure_numeric" | tee /tmp/lab.log
      - name: Publish
        if: always()
        run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git checkout -q --orphan lab-tmp
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          if [ -s /tmp/lab.json ]; then cp /tmp/lab.json .; elif [ -s /tmp/prev_lab.json ]; then cp /tmp/prev_lab.json lab.json; fi
          cp /tmp/progress.json /tmp/lab.log . 2>/dev/null || true
          git add -A && git commit -qm "lab $(date -u +%FT%TZ)" && git push -f origin HEAD:refs/heads/lab-data
