name: Build app data (full universe)
# ~1,650 stocks. Heavy per-ticker data is cached on the `cache-data` branch so daily runs only fetch what changed.
# Output (index.json + detail shards) goes to the `app-data` branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jobs/app/**", "!jobs/app/prices_quick.py", "!jobs/app/daily_digest.py", ".github/workflows/app-build.yml"]
  schedule:
    - cron: "7 22 * * 1-5"    # Mon–Fri 22:07 UTC = 6:07pm EDT / 5:07pm EST, after the close (Tom wants end-of-day data)
permissions:
  contents: write
concurrency:
  group: app-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r jobs/requirements.txt
      - name: Restore caches and congress data
        run: |
          mkdir -p cache
          git fetch origin cache-data && for f in yahoo insiders news; do git show origin/cache-data:$f.json.gz > cache/$f.json.gz || true; done || echo "no cache yet"
          git fetch origin politics-data && git show origin/politics-data:politics.json > politics.json || echo "no politics data"
      - name: Build
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -o pipefail
          python jobs/app/build_all.py --out app-data --cache cache 2>&1 | tee app-build.log
          echo "exit ok" >> app-build.log
      - name: Save caches
        if: always()
        run: |
          mkdir -p /tmp/c && cp cache/*.json.gz /tmp/c/ 2>/dev/null || true
          rm -rf /tmp/ad && (cp -r app-data /tmp/ad 2>/dev/null || mkdir -p /tmp/ad); cp app-build.log /tmp/ad/ 2>/dev/null || true
          git config user.name "app-bot"; git config user.email "app-bot@users.noreply.github.com"
          git checkout --orphan cache-tmp
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/c/*.json.gz . 2>/dev/null || true
          git add *.json.gz 2>/dev/null && git commit -qm "cache ${{ github.run_id }}" && git push -f origin HEAD:cache-data || echo "no cache to save"
          # keep the build log (and memory info) on its own branch so failures can be diagnosed without API auth
          git checkout -q --orphan log-tmp && git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tail -c 3000000 /tmp/ad/app-build.log > app-build.log 2>/dev/null || echo "no log" > app-build.log
          (free -m; dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -5) > runner.txt 2>&1 || true
          git add app-build.log runner.txt && git commit -qm "log ${{ github.run_id }}" && git push -f origin HEAD:build-log || true
      - name: Publish app data
        if: success()
        run: |
          test -f /tmp/ad/index.json
          git checkout --orphan app-tmp
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/ad app-data
          git add app-data && git commit -qm "app data ${{ github.run_id }} ($(date -u +%FT%TZ))"
          git push -f origin HEAD:app-data
