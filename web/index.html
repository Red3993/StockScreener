<title>StockScreener</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling view, bottom tab bar; a stock opens as a full sheet with its own tabs. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e8ecf2; --line:#d5dbe5; --fg:#151b26; --muted:#5b6575; --faint:#8a93a3;
  --accent:#2b47c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb; --up:#13795b; --down:#b83a2e; --warn:#a86a00;
  --s1:#b3392c; --s2:#c4512b; --s3:#cf6d2c; --s4:#c98a2a; --s5:#b49c33; --s6:#8fa23f; --s7:#5f9b4f; --s8:#348f5f; --s9:#1d7f68; --s10:#0f6d6f;
  --sma50:#c47a12; --sma200:#7b4bb8; --price:#151b26; --chip-ink:#ffffff;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --sunk:#1f2530; --line:#2c3441; --fg:#e7ebf1; --muted:#9aa4b4; --faint:#6f7a8b;
  --accent:#8099ff; --accent-ink:#0b1020; --accent-soft:#232c4a; --up:#45c08f; --down:#ef7a6c; --warn:#e3a640;
  --s1:#e06352; --s2:#e2774c; --s3:#e08d48; --s4:#d9a446; --s5:#c9b450; --s6:#a8bd5a; --s7:#7fbb6c; --s8:#55b082; --s9:#3fa391; --s10:#3b9aa3;
  --sma50:#e3a640; --sma200:#b48cf0; --price:#e7ebf1; --chip-ink:#0f1319; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --sunk:#1f2530; --line:#2c3441; --fg:#e7ebf1; --muted:#9aa4b4; --faint:#6f7a8b;
  --accent:#8099ff; --accent-ink:#0b1020; --accent-soft:#232c4a; --up:#45c08f; --down:#ef7a6c; --warn:#e3a640;
  --s1:#e06352; --s2:#e2774c; --s3:#e08d48; --s4:#d9a446; --s5:#c9b450; --s6:#a8bd5a; --s7:#7fbb6c; --s8:#55b082; --s9:#3fa391; --s10:#3b9aa3;
  --sma50:#e3a640; --sma200:#b48cf0; --price:#e7ebf1; --chip-ink:#0f1319; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:12.5px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gut-r)}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.asof{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
main{max-width:1100px;margin:0 auto;padding-block:14px 110px;padding-left:var(--gut);padding-right:var(--gut-r)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:10px 2px 9px;font-size:11.5px;white-space:nowrap;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs .sm{display:none}
@media (max-width:560px){.tabs .lg{display:none}.tabs .sm{display:inline}.tabs button{font-size:10.5px}}
.tabs button[aria-current="page"]{color:var(--accent)}
.disclaimer{font-size:12px;color:var(--faint);margin-top:28px;text-align:center}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.snip{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptl{font-size:10.5px;color:var(--faint);margin-left:6px;font-weight:500}
.pxbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;color:var(--muted)}
.pxbox input{width:64px;border:0;background:none;color:var(--fg);font:inherit;padding:9px 0;outline:none}
.search{flex:1 1 180px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.count-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}

/* score chip + ruler */
.chip{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font:600 13px var(--f-mono);color:var(--chip-ink)}
.chip.na{background:var(--sunk)!important;color:var(--faint)}
.ruler{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:8px}
.ruler i{border-radius:2px;background:var(--sunk)}
.overall{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
.overall small{font-size:16px;color:var(--muted);font-weight:500;letter-spacing:0}
.scores7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 3px repeat(2,minmax(0,1fr));gap:3px}
.scores7 .sep{border-left:1px dashed var(--line);align-self:stretch;margin:2px 0}
.sc7.tm{outline:1.5px solid color-mix(in srgb,var(--fg) 22%,transparent);outline-offset:-1.5px}
.sc7{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;height:34px;color:var(--chip-ink);line-height:1.05}
.sc7 small{font-size:9.5px;font-weight:600;letter-spacing:.02em;opacity:.92}
.sc7 b{font:600 13.5px var(--f-mono)}
.sc7.na{background:var(--sunk);color:var(--faint)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"id px ov" "s7 s7 s7";gap:8px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .id{grid-area:id;min-width:0} .row .px{grid-area:px} .row .ov{grid-area:ov} .row .scores7{grid-area:s7}
.tk{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;font-family:var(--f-mono);font-size:14px;min-width:92px}
.px small{display:block;font-size:12px}
.r52{position:relative;height:4px;border-radius:2px;background:var(--sunk);margin-top:5px}
.r52 i{position:absolute;top:-2px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--fg)}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.why .badge{white-space:normal;text-align:left}
.head{display:none}
@media (min-width:760px){
  .row{grid-template-columns:minmax(0,1.3fr) 120px 52px minmax(0,400px);grid-template-areas:"id px ov s7"}
  .head{display:grid;grid-template-columns:minmax(0,1.3fr) 120px 52px minmax(0,400px);gap:10px;padding:8px 14px;background:var(--sunk);align-items:center}
  .head span:nth-child(2){text-align:right}
  .row .scores7 small{display:none}
  .sc7{height:26px}
}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.good{color:var(--up)} .badge.bad{color:var(--down)} .badge.warn{color:var(--warn)} .badge.acc{color:var(--accent);background:var(--accent-soft)}

/* filters */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.fchip button{border:0;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1}
.fchip .edit{padding:0;font-weight:600;color:var(--fg);font-size:13px}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.presets button{flex:none;border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.presets button[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--text,inherit);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.presets button .bot{vertical-align:-3px}
.panel{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.panel-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;padding-left:var(--gut);padding-right:var(--gut-r)}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.frow-h{display:flex;align-items:baseline;gap:8px}
.frow-h b{flex:1}
.rng{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rng input[type=number]{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:var(--f-mono)}
.picker{display:grid;gap:14px}
.picker h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.picker .opts{display:flex;flex-wrap:wrap;gap:6px}
.picker .opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left}
.picker .opts button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* sheet (detail) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 8px) 0;padding-left:var(--gut);padding-right:var(--gut-r)}
.sheet-top .top-row{gap:10px}
.back{background:none;border:0;padding:6px 8px 6px 0;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
.dtabs{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:6px auto 0;scrollbar-width:none}
.dtabs button{flex:none;border:0;background:none;padding:9px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sheet main{padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 .label{font-family:var(--f-body)}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid2 .wide{grid-column:1/-1}}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.title-row h1{font-size:28px}
.price-big{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat .v{font:500 16px var(--f-mono);font-variant-numeric:tabular-nums}
.stat .label{font-size:10.5px}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bar52{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--s2),var(--s5),var(--s9));opacity:.85;margin:10px 0 4px}
.bar52 i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--fg)}

/* chart */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* categories */
.catlist{display:grid;gap:2px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;padding:9px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left}
.cat:hover,.cat[aria-expanded="true"]{background:var(--sunk)}
.cat .ruler{grid-column:1/-1}
.cat-name{font-weight:600}
.cat-na{font-size:12px;color:var(--faint)}
.metrics{grid-column:1/-1;margin:4px 0 6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.pctbar{position:relative;height:6px;border-radius:3px;background:var(--sunk);min-width:60px}
.pctbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}

/* analyst */
.distbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0}
.distbar span{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.rangebar{position:relative;height:30px;margin:8px 4px 20px}
.rangebar .track{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--sunk);border-radius:2px}
.rangebar .mark{position:absolute;top:6px;width:2px;height:18px;background:var(--fg)}
.rangebar .mean{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent)}
.rangebar .tick{position:absolute;top:32px;font:11px var(--f-mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.feed{display:grid;gap:0;max-height:340px;overflow-y:auto}
.feed>div{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.feed>div:first-child{border-top:0}
.news a{display:block;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.news a:first-child{border-top:0}
.news a:hover b{text-decoration:underline}
.news b{font-weight:600;font-size:14.5px;display:block}

/* AI */
.ai{border-color:var(--accent)}
.ai h3 svg{width:18px;height:18px;color:var(--accent);align-self:center}
.md h4{font-family:var(--f-display);font-size:15px;margin:14px 0 4px}
.md h4:first-child{margin-top:0}
.md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px} .md li{margin:3px 0}
.chatlog{display:grid;gap:10px;margin-top:12px}
.msg{padding:10px 12px;border-radius:10px;font-size:14.5px;max-width:92%}
.msg.me{background:var(--accent);color:var(--accent-ink);justify-self:end;white-space:pre-wrap}
.msg.bot{background:var(--sunk);justify-self:start}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin textarea{min-height:44px;flex:1}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;text-align:left;width:100%;position:relative;overflow:hidden;display:grid;gap:4px;cursor:pointer}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.acard[aria-expanded="true"]{border-color:var(--pc)}
.acard .ahead{display:flex;align-items:center;gap:8px}
.bot{flex:none;display:inline-block;vertical-align:middle}
.pk{display:inline-flex;align-items:center;gap:1px;margin-left:6px;vertical-align:-2px}
.pk .bot.short{border-radius:50%;box-shadow:0 0 0 1.5px var(--down)}
.cpk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#d97757;color:#fff;font:700 9px/1 var(--f-mono)}
.tier{font:600 10.5px var(--f-mono);padding:1px 7px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.tier.good{background:color-mix(in srgb,var(--up) 18%,transparent);border-color:color-mix(in srgb,var(--up) 45%,var(--line))}
.tier.acc{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tier.bad{background:color-mix(in srgb,var(--down) 16%,transparent);border-color:color-mix(in srgb,var(--down) 40%,var(--line))}
.trow{cursor:pointer}.trow:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.rnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.rnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}.rnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.indgrp summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}
.acard .spark{display:block;width:100%;height:26px;margin-top:2px}
.acard .rank{font:600 12px var(--f-mono);color:var(--faint)}
.acard .nm2{font-family:var(--f-display);font-weight:700;font-size:16px}
.acard .ret{margin-left:auto;font:600 16px var(--f-mono)}
.acard .blurb{font-size:12.5px;color:var(--muted)}
.acard .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);font-family:var(--f-mono)}
.adetail{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pitch{border-left:3px solid var(--pc);padding-left:10px}
/* market brief (Calendar tab) */
.mkt{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:12px}
.mkt div{background:var(--sunk);border-radius:8px;padding:7px 9px;min-width:0}
.mkt .n{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt .v{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.mkt .c{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.brief h4{font-family:var(--f-display);font-size:15px;margin:14px 0 6px}
.brief ul{margin:0;padding-left:18px;display:grid;gap:6px} .brief li{font-size:14.5px}
.brief li b{font-weight:650}
.brief .when{font:600 12px var(--f-mono);color:var(--accent);margin-right:6px;white-space:nowrap}
.sectors{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hl{display:grid;gap:8px;margin-top:8px} .hl a{color:var(--fg);text-decoration:none} .hl a:hover{text-decoration:underline}
.hl .meta{font-size:11.5px;color:var(--faint)}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.thinking{color:var(--muted);font-style:italic}

/* calendar */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:16px}
.month .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.day.out{opacity:.4}
.day.today{border-color:var(--accent)}
.day .dots{display:flex;flex-wrap:wrap;gap:2px}
.day{position:relative}
.day.imp1{background:color-mix(in srgb,#eab308 14%,var(--surface))}
.day.imp2{background:color-mix(in srgb,#f97316 24%,var(--surface))}
.day.imp3{background:color-mix(in srgb,#ef4444 32%,var(--surface));border-color:color-mix(in srgb,#ef4444 55%,var(--line))}
.day .mv{margin-top:auto;font:600 10px var(--f-mono);color:var(--muted)}
.impkey{display:inline-block;width:14px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.impkey.k1{background:color-mix(in srgb,#eab308 30%,var(--surface))}.impkey.k2{background:color-mix(in srgb,#f97316 45%,var(--surface))}.impkey.k3{background:color-mix(in srgb,#ef4444 55%,var(--surface))}
.ibadge{font:600 10.5px var(--f-mono);padding:1px 6px;border-radius:99px;margin-left:8px;vertical-align:1px}
.ibadge.i1{background:color-mix(in srgb,#eab308 22%,transparent)}.ibadge.i2{background:color-mix(in srgb,#f97316 30%,transparent)}.ibadge.i3{background:color-mix(in srgb,#ef4444 38%,transparent)}
.mover{font:600 10px var(--f-mono);color:#f97316;margin-left:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.agenda{display:grid;gap:12px}
.agenda .date{font-weight:700;font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.ev{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:4px;font-size:14px}

textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--bg);resize:vertical}
.note{border-top:1px solid var(--line);padding:8px 0;font-size:14px;white-space:pre-wrap}
.note .meta{font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:12px;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.callout{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:60}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:16px;max-width:min(440px,calc(100vw - 32px));width:100%;box-sizing:border-box}
dialog::backdrop{background:rgba(10,14,20,.45)}
.spark{display:block;width:72px;height:22px}
.trend{font:600 12px var(--f-mono);white-space:nowrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.tog i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mklist{display:grid;gap:0;margin-top:8px;max-height:220px;overflow-y:auto}
.mklist>div{display:grid;grid-template-columns:70px 16px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--s1),var(--s5),var(--s10));margin:8px 0 4px}
.gauge i{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--fg)}
.gauge.stretch{background:linear-gradient(90deg,var(--s9),var(--s5),var(--s1))}
.regime{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-family:var(--f-display);font-size:18px}
.regime i{width:10px;height:10px;border-radius:50%}
.compbar{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.pick{display:grid;gap:8px}
.pick h3{margin:0}
.conv{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.row,.cat,.btn{transition:background-color .12s}}

const EVC = {earnings: "var(--accent)", ex_div: "var(--s9)", pay: "var(--s6)", fomc: "var(--down)", macro: "var(--warn)"};
function calEvents() {
  let rows = UI.calFilter === "all" ? ROWS : UI.calFilter === "IVV" ? ROWS.filter(r => r.ix?.includes("IVV")) : UI.calFilter === "top" ? ROWS.filter(r => r.top) : [];
  if (!["all", "IVV", "top"].includes(UI.calFilter)) { const l = lists().find(l => l.id === UI.calFilter); rows = l ? l.items.map(i => RB[i.ticker]).filter(Boolean) : []; }
  const ev = [];
  for (const r of rows) { const e = r.e || {};
    if (e.earn) ev.push({date: e.earn, kind: "earnings", t: r.t, label: `${r.t} earnings` + (e.eps ? ` · est. EPS $${e.eps.toFixed(2)}` : "")});
    if (e.exd) ev.push({date: e.exd, kind: "ex_div", t: r.t, label: `${r.t} ex-dividend`});
    if (e.pay) ev.push({date: e.pay, kind: "pay", t: r.t, label: `${r.t} dividend paid`}); }

// ================================================================ financials: price vs fundamentals band (weekly), RSI, drawdown
function valModel(s) {
  const ds = DATA.dates, c = s.closes || [];
  // weekly closes: last trading day of each week
  const wk = [];
  for (let i = 0; i < c.length; i++) { if (c[i] == null) continue; const d = new Date(ds[i] + "T12:00:00"), nx = ds[i + 1] ? new Date(ds[i + 1] + "T12:00:00") : null;
    if (!nx || nx.getDay() < d.getDay() || (nx - d) > 4 * 864e5) wk.push({date: ds[i], px: c[i]}); }
  if (wk.length < 30) return null;
  const q = (s.quarterly || []).filter(x => x.end && x.revenue != null), sh = s.shares_history || [];
  const sharesAt = d => { let v = null; for (const [e, n] of sh) { if (e <= d) v = n; } return v ?? (sh[0] ? sh[0][1] : null); };
  const Q = [];
  for (let j = 3; j < q.length; j++) {
    const four = q.slice(j - 3, j + 1), sharesN = sharesAt(q[j].end);
    if (!sharesN || four.some(x => x.revenue == null)) continue;
    const rev = four.reduce((a, x) => a + x.revenue, 0), ni = four.every(x => x.net_income != null) ? four.reduce((a, x) => a + x.net_income, 0) : null;
    const yoy = j >= 4 && q[j - 4].revenue ? q[j].revenue / q[j - 4].revenue - 1 : null;
    const known = new Date(Date.parse(q[j].end) + 40 * 864e5).toISOString().slice(0, 10);   // ~when the quarter was reported
    Q.push({end: q[j].end, known, eps: ni != null ? ni / sharesN : null, rps: rev / sharesN, yoy});
  }
  if (Q.length < 2) return null;
  const useEps = Q.every(x => x.eps != null && x.eps > 0);
  const per = x => useEps ? x.eps : x.rps;
  // historical multiple: weekly price / the per-share figure known at that time
  const mult = [];
  for (const w of wk) { let cur = null; for (const x of Q) if (x.known <= w.date) cur = x; if (cur) mult.push(w.px / per(cur)); }
  if (mult.length < 20) return null;
  const sorted = mult.slice().sort((a, b) => a - b), pctl = p => sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))];
  const lo = pctl(0.2), mid = pctl(0.5), hi = pctl(0.8);
  // weekly RSI and drawdown
  const rsi = rsiArr(wk.map(w => w.px), 14);
  let peak = 0; const dd = wk.map(w => { peak = Math.max(peak, w.px); return w.px / peak - 1; });
  // divergence: price makes a lower low (last 4 weeks vs 8-52 weeks ago) while RSI makes a higher low, and the mirror for highs
  const n = wk.length, rng = (a, b) => { const out = []; for (let i = Math.max(0, a); i < Math.min(n, b); i++) out.push(i); return out; };
  const recent = rng(n - 4, n), prior = rng(n - 52, n - 8);
  let div = null;
  if (recent.length && prior.length) {
    const rl = recent.reduce((a, i) => wk[i].px < wk[a].px ? i : a), pl = prior.reduce((a, i) => wk[i].px < wk[a].px ? i : a);
    const rh = recent.reduce((a, i) => wk[i].px > wk[a].px ? i : a), ph = prior.reduce((a, i) => wk[i].px > wk[a].px ? i : a);
    if (wk[rl].px < wk[pl].px && rsi[rl] != null && rsi[pl] != null && rsi[rl] > rsi[pl] + 3) div = {kind: "Bullish", a: pl, b: rl};
    else if (wk[rh].px > wk[ph].px && rsi[rh] != null && rsi[ph] != null && rsi[rh] < rsi[ph] - 3) div = {kind: "Bearish", a: ph, b: rh};
  }
  const last = Q[Q.length - 1], fair = [lo, mid, hi].map(m => m * per(last)), px = wk[n - 1].px;
  return {wk, Q, useEps, lo, mid, hi, rsi, dd, div, fair, px, per};

    ${curve.length > 2 ? `<dl class="kv" style="margin-top:10px"><dt>Score 9–10 basket, cumulative vs average</dt><dd>${spark(curve, 120, 22, "var(--up)")} <span class="num ${cls(curve[curve.length - 1])}">${pct(curve[curve.length - 1])}</span></dd></dl>` : ""}

      ${bk.map(b => `<tr${b.b === cur ? ' style="font-weight:700"' : ""}><td>${b.b}</td><td class="r num ${cls(b.avg)}">${pct(b.avg, 2)}</td><td class="r num">${pct(b.med, 2)}</td><td class="r num">${b.hit != null ? Math.round(b.hit * 100) + "%" : "—"}</td><td class="r num">${(b.n || 0).toLocaleString()}</td></tr>`).join("")}</tbody></table></details>
    <p class="faint small" style="margin:10px 0 0">Every week from ${esc(fmtMY(bt.dates?.[0]))} to ${esc(fmtMY(bt.dates?.[1]))}, every stock was scored using only data available that day, then its next ${H}-day return was compared with the average stock's. t ≥ 2 means the result is unlikely to be luck. Left out because no free history exists: estimate revisions, buybacks, short interest. Insider buying counts only from ${esc(fmtMY(bt.insider_since))}. Uses today's index members, which flatters results a little. Past results don't guarantee future ones.</p>
  </div>`;
}
function bindBacktest(s) {

function momentumCard(s, compact = false) {

  const i = m.inputs || {}, c = m.components || {};

  const bar = (l, v) => `<div class="compbar"><span class="muted">${l}</span><div class="pctbar"><i style="width:${v ?? 0}%;background:${sc((v ?? 0) / 10 + .5)}"></i></div><span class="num small">${v == null ? "—" : Math.round(v)}</span></div>`;
  return `<div class="card"><h3>Momentum & sentiment ${compact ? `<button class="link" data-goto="chart" style="margin-left:auto">Details</button>` : ""}</h3>
    <div class="regime"><i style="background:${REGIME_C[m.regime] || "var(--faint)"}"></i>${esc(m.regime)}</div>
    ${(m.reasons || []).length ? `<ul class="small muted" style="margin:6px 0 0;padding-left:18px">${m.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <div class="stats" style="margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))">

      <div><div class="label">Stretch ${Math.round(m.stretch)}/100</div><div class="gauge stretch"><i style="left:${m.stretch}%"></i></div><div class="faint small">room to run ← → overextended</div></div>
    </div>
    ${compact ? "" : `<div style="margin-top:12px">${bar("Trend", c.trend)}${bar("Relative strength", c.relative_strength)}${bar("Buying pressure", c.buying_pressure)}</div>`}
    <dl class="kv" style="margin-top:12px">
      <dt>Put/call ratio (options volume)</dt><dd>${pcTxt}</dd>
      ${compact ? "" : `<dt>Put/call (open interest)</dt><dd>${i.put_call_oi != null ? i.put_call_oi.toFixed(2) : "—"}</dd>`}
      <dt>Short interest</dt><dd>${i.short_pct_float != null ? (i.short_pct_float * 100).toFixed(1) + "% of float" : "—"}${i.short_change_1m != null ? ` <span class="${i.short_change_1m > 0 ? "down" : "up"}">(${pct(i.short_change_1m)} m/m)</span>` : ""}</dd>
      ${compact ? "" : `<dt>Up-day volume share, 20 days</dt><dd>${i.up_volume_share_20d != null ? (i.up_volume_share_20d * 100).toFixed(0) + "%" : "—"}</dd>
      <dt>Volume vs 6-month average</dt><dd>${i.rel_volume != null ? i.rel_volume.toFixed(2) + "×" : "—"}</dd>
      <dt>12-month return (ex last month)</dt><dd class="${cls(i.r12_1)}">${pct(i.r12_1)}</dd><dt>3-month return</dt><dd class="${cls(i.r3m)}">${pct(i.r3m)}</dd>
      <dt>vs 200-day average</dt><dd>${pct(i.vs200)} (${i.vs200_z != null ? (i.vs200_z > 0 ? "+" : "") + i.vs200_z.toFixed(1) + "σ vs own 3y" : ""})</dd><dt>RSI (14-day)</dt><dd>${i.rsi != null ? i.rsi.toFixed(0) : "—"}</dd>`}
    </dl>
    ${compact ? "" : `<p class="faint small" style="margin-bottom:0">Momentum = 35% trend (price vs 50/200-day averages and their slope) + 35% relative strength (12-month-minus-last-month and 3-month returns) + 30% buying pressure (up-day volume share and On-Balance Volume), each ranked against every stock in the app. Stretch blends RSI, distance above the 200-day versus the stock’s own 3-year range, and closeness to the 52-week high. Put/call and short interest are shown as context, not scored. Options data covers the two nearest expiries.</p>`}
  </div>`;

function spark(vals, w = 72, h = 22, color = "var(--accent)") {
  const v = vals.map((x, i) => [i, x]).filter(p => p[1] != null && isFinite(p[1])); if (v.length < 2) return "";
  const xs = v.map(p => p[0]), ys = v.map(p => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const X = x => 2 + (x - x0) / (x1 - x0 || 1) * (w - 4), Y = y => h - 3 - (y - y0) / (y1 - y0) * (h - 6);
  const d = v.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const L = v[v.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${X(L[0])}" cy="${Y(L[1])}" r="2.3" fill="${color}"/></svg>`;
}
function catTrend(s, c) {
  const h = s.score_history || []; if (h.length < 3) return {svg: "", delta: null};
  const idx = c === "overall" ? 0 : 1 + CATS.filter(x => x !== "Analyst").indexOf(c);
  const vals = h.map(p => p ? p[idx] : null);
  const cur = c === "overall" ? (() => { const v = CATS.filter(x => x !== "Analyst").map(x => s.categories?.[x]?.score).filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; })() : s.categories?.[c]?.score ?? null;
  vals.push(cur);
  const ago = vals.length > 4 ? vals[vals.length - 5] : vals[0];
  return {svg: spark(vals), delta: cur != null && ago != null ? cur - ago : null};
}
const deltaTxt = d => d == null ? "" : `<span class="trend ${d > 0 ? "up" : d < 0 ? "down" : "faint"}">${d > 0 ? "▲" : d < 0 ? "▼" : "■"} ${d > 0 ? "+" : ""}${Math.round(d * 10) / 10} vs 1y</span>`;
function metricTrend(s, key, now) {
  const h = s.metric_history?.[key]; if (!h) return "";

  const ago = h.length >= 4 ? h[h.length - 4] : null;
  const dir = DATA.directions?.[key] ?? 1;

  if (ago != null && now != null && ago !== 0) { const better = (now - ago) * dir > 0, same = Math.abs(now - ago) <= Math.abs(ago) * 0.02;
    arrow = `<span class="trend ${same ? "faint" : better ? "up" : "down"}" title="1 year ago: ${esc(fmtMetric(key, ago))}">${same ? "■" : now > ago ? "▲" : "▼"} ${esc(fmtMetric(key, ago))} 1y ago</span>`; }
  return `<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:3px">${spark(vals, 56, 16, "var(--muted)")}</div>${arrow ? `<div style="text-align:right">${arrow}</div>` : ""}`;
}
