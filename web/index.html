<title>StockScreener</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling view, bottom tab bar; a stock opens as a full sheet with its own tabs. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e8ecf2; --line:#d5dbe5; --fg:#151b26; --muted:#5b6575; --faint:#8a93a3;
  --accent:#2b47c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb; --up:#13795b; --down:#b83a2e; --warn:#a86a00;
  --s1:#b3392c; --s2:#c4512b; --s3:#cf6d2c; --s4:#c98a2a; --s5:#b49c33; --s6:#8fa23f; --s7:#5f9b4f; --s8:#348f5f; --s9:#1d7f68; --s10:#0f6d6f;
  --sma50:#c47a12; --sma200:#7b4bb8; --price:#151b26; --chip-ink:#ffffff;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --sunk:#1f2530; --line:#2c3441; --fg:#e7ebf1; --muted:#9aa4b4; --faint:#6f7a8b;
  --accent:#8099ff; --accent-ink:#0b1020; --accent-soft:#232c4a; --up:#45c08f; --down:#ef7a6c; --warn:#e3a640;
  --s1:#e06352; --s2:#e2774c; --s3:#e08d48; --s4:#d9a446; --s5:#c9b450; --s6:#a8bd5a; --s7:#7fbb6c; --s8:#55b082; --s9:#3fa391; --s10:#3b9aa3;
  --sma50:#e3a640; --sma200:#b48cf0; --price:#e7ebf1; --chip-ink:#0f1319; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --sunk:#1f2530; --line:#2c3441; --fg:#e7ebf1; --muted:#9aa4b4; --faint:#6f7a8b;
  --accent:#8099ff; --accent-ink:#0b1020; --accent-soft:#232c4a; --up:#45c08f; --down:#ef7a6c; --warn:#e3a640;
  --s1:#e06352; --s2:#e2774c; --s3:#e08d48; --s4:#d9a446; --s5:#c9b450; --s6:#a8bd5a; --s7:#7fbb6c; --s8:#55b082; --s9:#3fa391; --s10:#3b9aa3;
  --sma50:#e3a640; --sma200:#b48cf0; --price:#e7ebf1; --chip-ink:#0f1319; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:12.5px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gut);padding-right:var(--gut-r)}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.asof{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
main{max-width:1100px;margin:0 auto;padding-block:14px 110px;padding-left:var(--gut);padding-right:var(--gut-r)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:10px 4px 9px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.disclaimer{font-size:12px;color:var(--faint);margin-top:28px;text-align:center}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 180px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.count-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}

/* score chip + ruler */
.chip{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font:600 13px var(--f-mono);color:var(--chip-ink)}
.chip.na{background:var(--sunk)!important;color:var(--faint)}
.ruler{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:8px}
.ruler i{border-radius:2px;background:var(--sunk)}
.overall{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
.overall small{font-size:16px;color:var(--muted);font-weight:500;letter-spacing:0}
.scores7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.sc7{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;height:34px;color:var(--chip-ink);line-height:1.05}
.sc7 small{font-size:9.5px;font-weight:600;letter-spacing:.02em;opacity:.92}
.sc7 b{font:600 13.5px var(--f-mono)}
.sc7.na{background:var(--sunk);color:var(--faint)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"id px ov" "s7 s7 s7";gap:8px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .id{grid-area:id;min-width:0} .row .px{grid-area:px} .row .ov{grid-area:ov} .row .scores7{grid-area:s7}
.tk{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;font-family:var(--f-mono);font-size:14px;min-width:92px}
.px small{display:block;font-size:12px}
.r52{position:relative;height:4px;border-radius:2px;background:var(--sunk);margin-top:5px}
.r52 i{position:absolute;top:-2px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--fg)}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.head{display:none}
@media (min-width:760px){
  .row{grid-template-columns:minmax(0,1.3fr) 120px 52px minmax(0,320px);grid-template-areas:"id px ov s7"}
  .head{display:grid;grid-template-columns:minmax(0,1.3fr) 120px 52px minmax(0,320px);gap:10px;padding:8px 14px;background:var(--sunk);align-items:center}
  .head span:nth-child(2){text-align:right}
  .row .scores7 small{display:none}
  .sc7{height:26px}
}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.good{color:var(--up)} .badge.bad{color:var(--down)} .badge.warn{color:var(--warn)} .badge.acc{color:var(--accent);background:var(--accent-soft)}

/* filters */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.fchip button{border:0;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1}
.fchip .edit{padding:0;font-weight:600;color:var(--fg);font-size:13px}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.presets button{flex:none;border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.panel{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.panel-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;padding-left:var(--gut);padding-right:var(--gut-r)}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.frow-h{display:flex;align-items:baseline;gap:8px}
.frow-h b{flex:1}
.rng{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rng input[type=number]{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:var(--f-mono)}
.picker{display:grid;gap:14px}
.picker h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.picker .opts{display:flex;flex-wrap:wrap;gap:6px}
.picker .opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left}
.picker .opts button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* sheet (detail) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 8px) 0;padding-left:var(--gut);padding-right:var(--gut-r)}
.sheet-top .top-row{gap:10px}
.back{background:none;border:0;padding:6px 8px 6px 0;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
.dtabs{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:6px auto 0;scrollbar-width:none}
.dtabs button{flex:none;border:0;background:none;padding:9px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sheet main{padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 .label{font-family:var(--f-body)}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid2 .wide{grid-column:1/-1}}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.title-row h1{font-size:28px}
.price-big{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat .v{font:500 16px var(--f-mono);font-variant-numeric:tabular-nums}
.stat .label{font-size:10.5px}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bar52{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--s2),var(--s5),var(--s9));opacity:.85;margin:10px 0 4px}
.bar52 i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--fg)}

/* chart */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* categories */
.catlist{display:grid;gap:2px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;padding:9px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left}
.cat:hover,.cat[aria-expanded="true"]{background:var(--sunk)}
.cat .ruler{grid-column:1/-1}
.cat-name{font-weight:600}
.cat-na{font-size:12px;color:var(--faint)}
.metrics{grid-column:1/-1;margin:4px 0 6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.pctbar{position:relative;height:6px;border-radius:3px;background:var(--sunk);min-width:60px}
.pctbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}

/* analyst */
.distbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0}
.distbar span{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.rangebar{position:relative;height:30px;margin:8px 4px 20px}
.rangebar .track{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--sunk);border-radius:2px}
.rangebar .mark{position:absolute;top:6px;width:2px;height:18px;background:var(--fg)}
.rangebar .mean{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent)}
.rangebar .tick{position:absolute;top:32px;font:11px var(--f-mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.feed{display:grid;gap:0;max-height:340px;overflow-y:auto}
.feed>div{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.feed>div:first-child{border-top:0}
.news a{display:block;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.news a:first-child{border-top:0}
.news a:hover b{text-decoration:underline}
.news b{font-weight:600;font-size:14.5px;display:block}

/* AI */
.ai{border-color:var(--accent)}
.ai h3 svg{width:18px;height:18px;color:var(--accent);align-self:center}
.md h4{font-family:var(--f-display);font-size:15px;margin:14px 0 4px}
.md h4:first-child{margin-top:0}
.md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px} .md li{margin:3px 0}
.chatlog{display:grid;gap:10px;margin-top:12px}
.msg{padding:10px 12px;border-radius:10px;font-size:14.5px;max-width:92%}
.msg.me{background:var(--accent);color:var(--accent-ink);justify-self:end;white-space:pre-wrap}
.msg.bot{background:var(--sunk);justify-self:start}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin textarea{min-height:44px;flex:1}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.thinking{color:var(--muted);font-style:italic}

/* calendar */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:16px}
.month .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.day.out{opacity:.4}
.day.today{border-color:var(--accent)}
.day .dots{display:flex;flex-wrap:wrap;gap:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.agenda{display:grid;gap:12px}
.agenda .date{font-weight:700;font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.ev{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:4px;font-size:14px}

textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--bg);resize:vertical}
.note{border-top:1px solid var(--line);padding:8px 0;font-size:14px;white-space:pre-wrap}
.note .meta{font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:12px;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.callout{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:60}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:16px;max-width:min(440px,calc(100vw - 32px));width:100%;box-sizing:border-box}
dialog::backdrop{background:rgba(10,14,20,.45)}
@media (prefers-reduced-motion:no-preference){.row,.cat,.btn{transition:background-color .12s}}
</style>

<div class="top"><div class="top-row">
  <div class="brand">Stock<b>Screener</b></div>
  <div class="asof" id="asof">Loading data…</div>
</div></div>

<main id="view"><div class="empty">Loading…</div></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="stocks" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>Stocks</button>
  <button data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Watchlists</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>Calendar</button>
  <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></svg>Data</button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="fpanel" class="panel" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
// ================================================================ helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const EVC = {earnings: "var(--accent)", ex_div: "var(--s9)", pay: "var(--s6)", fomc: "var(--down)", macro: "var(--warn)"};
function calEvents() {
  let tick = DATA.stocks.map(s => s.ticker);
  if (UI.calFilter !== "all") { const l = lists().find(l => l.id === UI.calFilter); tick = l ? l.items.map(i => i.ticker) : []; }
  const ev = [];
  for (const t of tick) { const s = BY[t]; if (!s) continue; const c = s.calendar || {};
    (c.earnings || []).slice(0, 1).forEach(d => ev.push({date: d, kind: "earnings", t, label: `${t} earnings` + (c.eps_estimate ? ` · est. EPS $${c.eps_estimate.toFixed(2)}` : "")}));
    if (c.ex_dividend) ev.push({date: c.ex_dividend, kind: "ex_div", t, label: `${t} ex-dividend`});
    if (c.dividend_pay) ev.push({date: c.dividend_pay, kind: "pay", t, label: `${t} dividend paid`}); }
  (DATA.macro || []).forEach(m => ev.push({date: m.date, kind: m.type === "fomc" ? "fomc" : "macro", label: m.label}));
  return ev.sort((a, b) => a.date.localeCompare(b.date));
}

  const upcoming = ev.filter(e => e.date >= todayS).slice(0, 80);
  const grouped = {}; upcoming.forEach(e => (grouped[e.date] ||= []).push(e));
  $("#view").innerHTML = `
    <div class="bar">
      <select class="sel" id="cf" aria-label="Show"><option value="all">All ${DATA.top_n} stocks</option>${lists().map(l => `<option value="${esc(l.id)}" ${UI.calFilter === l.id ? "selected" : ""}>Watchlist: ${esc(l.name)}</option>`).join("")}</select>

      await Store.setSyn(s.ticker, body);
      if (Sheet.t === s.ticker) { this.setBusy(false); this.renderBox(s, body); }
    } catch (e) {
      if (e?.text && e.code !== "refused") out.innerHTML = `<div class="md">${md(e.text)}</div>`; else out.innerHTML = "";
      if (e?.code !== "cancelled") out.insertAdjacentHTML("beforeend", `<p class="down small">${esc(this.errText(e))}</p>`);
    } finally { this.setBusy(false); }
  },
  toolsFor() {
    if (!this.tools) return undefined;
    return [
      {name: "get_stock", description: "Returns scores, key metrics, price signals and analyst/insider summary for one ticker in this app (100 large US stocks). Use to compare with peers.",
       inputSchema: {type: "object", properties: {ticker: {type: "string"}}, required: ["ticker"]},
       execute: ({ticker}) => { const s = BY[String(ticker || "").toUpperCase()]; if (!s) throw new Error("Not in this app's 100 stocks: " + ticker); return stockContext(s, false) + "\n" + CATS.map(c => `${c} key metrics: ` + (s.categories?.[c]?.metrics || []).filter(m => m.value != null).slice(0, 4).map(m => `${m.label} ${fmtMetric(m.key, m.value)}`).join(", ")).join("\n"); }},
      {name: "list_sector", description: "Lists the stocks in this app for a GICS sector with overall and category scores. Sector names: " + [...new Set(DATA.stocks.map(s => s.sector))].join(", ") + ".",
       inputSchema: {type: "object", properties: {sector: {type: "string"}}, required: ["sector"]},
       execute: ({sector}) => DATA.stocks.filter(s => s.sector.toLowerCase() === String(sector || "").toLowerCase()).map(s => `${s.ticker} ${s.name}: overall ${s.overall}; ` + CATS.map(c => `${CAT_SHORT[c]} ${s.categories?.[c]?.score ?? "NA"}`).join(" ")).join("\n") || "No stocks in that sector."},
    ];
  },
  async ask(s) {
    const inp = $("#chatIn"); const q = inp.value.trim(); if (!q || this.busy) return;
    const chat = this.chats[s.ticker] ||= [];
    chat.push({role: "user", content: q}); inp.value = "";
    const log = $("#chatlog"); $(".suggest") && $(".suggest").remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div class="msg bot md" id="botNow"><span class="thinking">Thinking…</span></div>`);
    const bot = $("#botNow"); bot.removeAttribute("id"); bot.scrollIntoView({block: "nearest", behavior: "smooth"});
    this.setBusy(true); this.ctl = new AbortController();
    const intro = `${RULES}\n\nYou are answering questions about ${s.name} (${s.ticker}) in a chat. Keep answers focused, usually under 200 words, with "- " bullets where helpful.${this.tools ? " You can call get_stock or list_sector to compare with other stocks in the app." : ""}\n\nDATA\n${stockContext(s)}`;
    const turns = [{role: "user", content: intro}, ...chat.slice(-10)];
    try {
      const opts = {signal: this.ctl.signal, cache: false, onText: ({text}) => { bot.innerHTML = md(text); }};
      const tools = this.toolsFor(); if (tools) { opts.tools = tools; delete opts.cache; }
      const {text} = await this.sample(turns, opts);
      chat.push({role: "assistant", content: text}); bot.innerHTML = md(text);
    } catch (e) {
      bot.innerHTML = (e?.text && e.code !== "refused" ? md(e.text) : "") + (e?.code === "cancelled" ? `<p class="faint small">Stopped.</p>` : `<p class="down small">${esc(this.errText(e))}</p>`);
      if (e?.text && e.code !== "refused") chat.push({role: "assistant", content: e.text}); else chat.pop();
    } finally { this.setBusy(false); }
  },
};

    <div class="card wide">${chartInner(s)}</div>

function metricTable(s, c) {
  const k = s.categories[c]; if (!k) return "";
  return `<table><thead><tr><th>Metric</th><th class="r">Value</th><th>Rank</th></tr></thead><tbody>${k.metrics.map(m => {
    if (m.value == null) return `<tr><td>${esc(m.label)}</td><td class="r faint">N/A</td><td class="faint" style="font-size:12px">${esc(m.na || "")}</td></tr>`;
    const p = m.pct ?? 0, basis = m.basis === "sector" ? `vs ${m.peers} ${esc(s.sector)} stocks` : `vs all ${m.peers} stocks with data`;
    return `<tr><td>${esc(m.label)}</td><td class="r num">${fmtMetric(m.key, m.value)}</td><td style="min-width:140px">
      <div class="pctbar" title="${p.toFixed(0)}th percentile"><i style="width:${p}%;background:${sc(p / 10 + 0.5)}"></i></div>
      <div class="faint" style="font-size:11.5px;margin-top:3px">${ord(m.pct_peer)} pct ${basis}${m.pct_own != null ? ` · ${ord(m.pct_own)} vs own 3y` : m.own_na ? ` · own history N/A` : ""}</div></td></tr>`; }).join("")}</tbody></table>
    <p class="faint" style="font-size:11.5px;margin:6px 0 0">Higher rank is better. ${c === "Valuation" ? "Ratios blend sector rank and own-history rank 50/50; 100 means cheapest. " : ""}Category score ${k.score ?? "N/A"} = average rank ${k.avg_pct != null ? k.avg_pct.toFixed(0) : "—"}${k.n_used ? ` across ${k.n_used} of ${k.n_total} metrics` : ""}.</p>`;
}
function analystCard(s) {
  const a = s.analyst; if (!a || !a.n_analysts) return `<div class="card"><h3>Analysts</h3><p class="muted">No analyst coverage data.</p></div>`;
  const r = a.ratings || {}, tot = Object.values(r).reduce((x, y) => x + y, 0) || 1;
  const RC = [["strongBuy", "Strong buy", "var(--s10)"], ["buy", "Buy", "var(--s8)"], ["hold", "Hold", "var(--s5)"], ["sell", "Sell", "var(--s3)"], ["strongSell", "Strong sell", "var(--s1)"]];
  const px = DER[s.ticker].price, t = a.targets; let range = "";
  if (t && t.low != null && t.high != null) { const lo = Math.min(t.low, px), hi = Math.max(t.high, px); const P = v => ((v - lo) / (hi - lo || 1) * 100).toFixed(1) + "%";
    range = `<div class="label" style="margin-top:14px">Price targets</div><div class="rangebar"><div class="track"></div><div class="mean" style="left:${P(t.mean)}" title="Mean target"></div><div class="mark" style="left:${P(px)}" title="Current price"></div><span class="tick" style="left:${P(t.low)}">${fmtMoney(t.low, 0)}</span><span class="tick" style="left:${P(t.high)}">${fmtMoney(t.high, 0)}</span></div>
      <dl class="kv"><dt>Mean target</dt><dd>${fmtMoney(t.mean)} <span class="${cls(t.mean / px - 1)}">(${pct(t.mean / px - 1)})</span></dd><dt>Median</dt><dd>${fmtMoney(t.median)}</dd><dt>Current</dt><dd>${fmtMoney(px)}</dd></dl>`; }
  const et = a.eps_trend?.["0y"], er = a.eps_revisions?.["0y"];
  const acts = (a.actions || []).filter(x => ["up", "down", "init"].includes(x.action) || x.pt_action === "Raises" || x.pt_action === "Lowers").slice(0, 25);
  const AL = {up: ["Upgrade", "good"], down: ["Downgrade", "bad"], init: ["Initiated", "acc"], main: ["Maintained", ""], reit: ["Reiterated", ""]};
  return `<div class="card"><h3>Analysts <span class="label">${a.n_analysts} covering</span>${a.thin_coverage ? `<span class="badge warn">Thin coverage</span>` : ""}</h3>
    <div class="label">Ratings this month</div>
    <div class="distbar">${RC.map(([k, , c]) => r[k] ? `<span style="width:${r[k] / tot * 100}%;background:${c}" title="${k}: ${r[k]}"></span>` : "").join("")}</div>
    <div class="legend" style="margin:0">${RC.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l} ${r[k] || 0}</span>`).join("")}</div>
    <dl class="kv" style="margin-top:10px"><dt>Consensus (1 = strong buy, 5 = sell)</dt><dd>${a.rating_mean != null ? a.rating_mean.toFixed(2) : "—"}</dd>
      ${et ? `<dt>This year’s EPS estimate</dt><dd>${fmtMoney(et.current)} <span class="${cls(et.current / et["90daysAgo"] - 1)}">(${pct(et.current / et["90daysAgo"] - 1)} vs 90 days ago)</span></dd>` : ""}
      ${er ? `<dt>Estimate revisions, 30 days</dt><dd><span class="up">${er.upLast30days ?? 0} up</span> · <span class="down">${er.downLast30days ?? 0} down</span></dd>` : ""}
      ${a.upgrades_90d != null ? `<dt>Rating changes, 90 days</dt><dd><span class="up">${a.upgrades_90d} up</span> · <span class="down">${a.downgrades_90d} down</span></dd>` : ""}</dl>
    ${range}
    ${acts.length ? `<div class="label" style="margin-top:14px">Recent actions</div><div class="feed">${acts.map(x => { const [l, c] = AL[x.action] || [x.action, ""]; return `<div><span class="faint num">${esc(fmtShort(x.date))}</span><span style="min-width:0">${esc(x.firm)} · <span class="badge ${c}">${esc(l)}</span> ${esc(x.to || "")}</span><span class="num faint">${x.pt ? fmtMoney(x.pt, 0) : ""}${x.pt_prior && x.pt && x.pt_prior !== x.pt ? ` <span class="${x.pt > x.pt_prior ? "up" : "down"}">${x.pt > x.pt_prior ? "↑" : "↓"}</span>` : ""}</span></div>`; }).join("")}</div>` : ""}
  </div>`;
}
function insiderCard(s) {
  const ins = s.insiders || {}, all = ins.trades || [], sm = ins.summary || {}, F = UI.insiderFilter;
  const tr = all.filter(t => F === "buys" ? t.code === "P" : F === "sales" ? t.code === "S" && !t.plan_10b5_1 : true);
  return `<div class="card"><h3>Insider trades <span class="label">last 12 months · ${ins.n_form4 ?? 0} Form 4s</span></h3>
    <div class="pill-row" style="margin-bottom:10px"><span class="badge good">${sm.buys || 0} buys · ${fmtBig(sm.buy_value || 0)}</span><span class="badge bad">${sm.disc_sales || 0} discretionary sales · ${fmtBig(sm.disc_sale_value || 0)}</span><span class="badge">${sm.plan_sales || 0} 10b5-1 plan sales · ${fmtBig(sm.plan_sale_value || 0)}</span>
      ${sm.ceo_cfo_buys ? `<span class="badge acc">${sm.ceo_cfo_buys} CEO/CFO buys</span>` : ""}${(ins.clusters || []).map(c => `<span class="badge acc" title="${esc(c.insiders.join(", "))}">Cluster buy ${esc(fmtDate(c.start))}: ${c.insiders.length} insiders</span>`).join("")}</div>
    <div class="seg" id="insF" style="margin-bottom:8px">${[["buys", "Buys"], ["sales", "Discretionary sales"], ["all", "All incl. plan sales"]].map(([v, l]) => `<button data-f="${v}" aria-pressed="${F === v}">${l}</button>`).join("")}</div>
    ${tr.length ? `<div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table><thead><tr><th>Date</th><th>Insider</th><th class="r">Shares</th><th class="r">Value</th></tr></thead><tbody>${tr.slice(0, 100).map(t => `<tr>
      <td class="num" style="white-space:nowrap">${esc(fmtShort(t.date || t.filed))}<div class="faint" style="font-size:11px">filed ${esc(fmtShort(t.filed))}</div></td>
      <td>${esc(t.owner)}${t.ceo ? ` <span class="badge acc">CEO</span>` : t.cfo ? ` <span class="badge acc">CFO</span>` : ""}<div class="faint" style="font-size:11.5px">${esc((t.roles || []).join(", "))}${t.code === "S" ? (t.plan_10b5_1 ? ` · 10b5-1 plan (${t.plan_10b5_1 === "footnote" ? "likely, from footnote" : "checkbox"})` : " · not a plan sale") : ""}</div></td>
      <td class="r num ${t.code === "P" ? "up" : "down"}">${t.code === "P" ? "+" : "−"}${Math.round(t.shares).toLocaleString()}<div class="faint" style="font-size:11px">${t.price ? "@ " + fmtMoney(t.price) : ""}</div></td><td class="r num">${fmtBig(t.value)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted" style="font-size:14px">${F === "buys" ? "No open-market insider buys in the last 12 months." : F === "sales" ? "No discretionary insider sales in the last 12 months." : "No open-market insider trades in the last 12 months."}</p>`}
    <p class="faint" style="font-size:11.5px;margin:6px 0 0">Open-market trades only (codes P and S). Option exercises, tax withholding, gifts and grants are excluded.</p></div>`;
}
function sharesCard(s) {
  const h = s.shares_history || []; if (h.length < 2) return `<div class="card"><h3>Share count</h3><p class="muted">Not enough filings to show a trend.</p></div>`;
  const last = h[h.length - 1][1], chg = y => { const i = h.length - 1 - y; return i >= 0 ? last / h[i][1] - 1 : null; };
  const W = 340, H = 120, max = Math.max(...h.map(x => x[1])), min = Math.min(...h.map(x => x[1])), lo = min - (max - min) * 0.6 - 1e-9, bw = W / h.length;
  const bars = h.map(([d, v], i) => { const hh = (v - lo) / (max - lo) * (H - 20); return `<rect x="${(i * bw + 2).toFixed(1)}" y="${(H - 16 - hh).toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${i === h.length - 1 ? "var(--accent)" : "var(--line)"}"><title>FY ${d.slice(0, 4)}: ${(v / 1e6).toFixed(0)}M shares</title></rect><text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 3}" font-size="9.5" text-anchor="middle" fill="var(--muted)">’${d.slice(2, 4)}</text>`; }).join("");
  const c1 = chg(1), trend = c1 == null ? "" : c1 < -0.002 ? `<span class="badge good">Buybacks (decreasing)</span>` : c1 > 0.002 ? `<span class="badge bad">Dilution (increasing)</span>` : `<span class="badge">Flat</span>`;
  return `<div class="card"><h3>Share count ${trend}</h3><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Diluted shares by fiscal year">${bars}</svg>
    <dl class="kv" style="margin-top:8px">${[[1, "1 year"], [3, "3 years"], [5, "5 years"], [10, "10 years"]].map(([y, l]) => { const c = chg(y); return c == null ? "" : `<dt>${l}</dt><dd class="${c < 0 ? "up" : c > 0 ? "down" : ""}">${pct(c)}</dd>`; }).join("")}</dl>
    <p class="faint" style="font-size:11.5px;margin:6px 0 0">Diluted weighted-average shares from 10-K filings, adjusted for stock splits. Latest: ${(last / 1e6).toLocaleString(undefined, {maximumFractionDigits: 0})}M.</p></div>`;
}
function fundCard(s) {
  const t = s.ttm || {}, q = (s.quarterly || []).filter(x => x.revenue != null);
  const W = 340, H = 110, mx = Math.max(...q.map(x => Math.abs(x.revenue)), 1), bw = W / Math.max(q.length, 1);
  const bars = q.map((x, i) => { const h = Math.abs(x.revenue) / mx * (H - 22), hn = x.net_income != null ? Math.max(0, x.net_income) / mx * (H - 22) : 0;
    return `<rect x="${(i * bw + 2).toFixed(1)}" y="${(H - 16 - h).toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--line)"><title>${x.end}: revenue ${fmtBig(x.revenue)}</title></rect>
      <rect x="${(i * bw + 2 + bw * .22).toFixed(1)}" y="${(H - 16 - hn).toFixed(1)}" width="${(bw * .56 - 4).toFixed(1)}" height="${hn.toFixed(1)}" rx="1.5" fill="var(--accent)"><title>${x.end}: net income ${fmtBig(x.net_income)}</title></rect>
      ${i % 2 === q.length % 2 ? "" : `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 3}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${x.end.slice(2, 7).replace("-", "/")}</text>`}`; }).join("");
  const rows = [["Revenue", t.revenue], ["Operating income", t.operating_income], ["Net income", t.net_income], ["Free cash flow", t.fcf], ["EBITDA", t.ebitda], ...(s.metric_set === "reit" ? [["FFO (approx.)", t.ffo]] : []), ["Dividends paid", t.dividends_paid ? Math.abs(t.dividends_paid) : null], ["Debt", t.debt], ["Cash & short-term inv.", t.cash_total], ["Equity", t.equity]];
  return `<div class="card"><h3>Financials <span class="label">trailing 12 months</span></h3>
    ${q.length ? `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Quarterly revenue and net income">${bars}</svg><div class="legend"><span><i style="background:var(--line)"></i>Quarterly revenue</span><span><i style="background:var(--accent)"></i>Net income</span></div>` : ""}
    <dl class="kv" style="margin-top:10px">${rows.map(([l, v]) => `<dt>${l}</dt><dd>${fmtBig(v)}</dd>`).join("")}</dl>
    <p class="faint" style="font-size:11.5px;margin:6px 0 0">From SEC XBRL filings through ${esc(fmtDate(s.latest_period))}. Market cap source: ${esc(s.mcap_source || "—")}.</p>
    ${eventsHtml(s)}</div>`;
}
function eventsHtml(s) {
  const c = s.calendar || {}, ev = [];
  (c.earnings || []).forEach(d => ev.push([d, "Earnings" + (c.eps_estimate ? ` · est. EPS ${fmtMoney(c.eps_estimate)}` : ""), "earnings"]));
  if (c.ex_dividend) ev.push([c.ex_dividend, "Ex-dividend date", "ex_div"]); if (c.dividend_pay) ev.push([c.dividend_pay, "Dividend paid", "pay"]);
  ev.sort((a, b) => a[0].localeCompare(b[0]));
  return `<div class="label" style="margin-top:16px">Dates</div>${ev.length ? ev.map(([d, l, k]) => `<div class="ev"><i class="dot" style="background:${EVC[k]}"></i><span style="flex:1">${esc(l)}</span><span class="num faint">${esc(fmtDate(d))}${d < DATA.lastDate ? " (past)" : ""}</span></div>`).join("") : `<p class="muted">No dates announced.</p>`}`;
}
